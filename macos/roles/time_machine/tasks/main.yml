---
# Time Machine
# In addition to this take a look at the time-machine-dev-exclusions.sh for more
- name: "Configure Time Machine exclusions"
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    type: "{{ item.type }}"
    state: "present"
    array_add: true
  vars:
    homedir: "/Users/ashhar.hasan"
  # needs superuser to change these
  become: true
  loop:
    - domain: "/Library/Preferences/com.apple.TimeMachine"
      key: "SkipPaths"
      type: "array"
      value:
        - "/Applications"
        - "/Library/Application Support/com.apple.idleassetsd"   # wallpapers and screensavers
        - "/opt/homebrew"
        - "/private/var/db/diagnostics"   # frequently changing
        - "/private/var/db/uuidtext"      # frequently changing
        - "{{ homedir }}/.cache"
        - "{{ homedir }}/.gradle"
        - "{{ homedir }}/.jenv"
        - "{{ homedir }}/.liquidprompt"
        - "{{ homedir }}/.local"
        - "{{ homedir }}/.m2/mvnd"
        - "{{ homedir }}/.m2/repository"
        - "{{ homedir }}/.m2/wrapper"
        - "{{ homedir }}/.npm"
        - "{{ homedir }}/.sdkman"
        - "{{ homedir }}/.vscode"
        - "{{ homedir }}/.yarn"
        - "{{ homedir }}/.zcompcache"
        - "{{ homedir }}/Applications"
        - "{{ homedir }}/Downloads/LocalSend"
        - "{{ homedir }}/Downloads/VideoDownloadHelper"
        - "{{ homedir }}/Library/Application Support/com.apple.mobileAssetDesktop"  # wallpapers and screensavers
        - "{{ homedir }}/Library/Application Support/Claude/vm_bundles"
        - "{{ homedir }}/Library/Application Support/Code"
        - "{{ homedir }}/Library/Application Support/Firefox/Profiles/524oqqak.default-nightly/storage/default/https+++open.spotify.com^userContextId=1/cache" # very noisy, the path would need to be updated for different firefox profile ids
        - "{{ homedir }}/Library/Application Support/Google"
        - "{{ homedir }}/Library/Application Support/Slack"
        - "{{ homedir }}/Library/Application Support/Spotify"
        - "{{ homedir }}/Library/Application Support/Stats"
        - "{{ homedir }}/Library/Application Support/zoom.us"
        - "{{ homedir }}/Library/CloudStorage/OneDrive-Personal"
        - "{{ homedir }}/Library/Containers/com.apple.Safari"
        - "{{ homedir }}/Library/Containers/com.apple.mediaanalysisd"
        - "{{ homedir }}/Library/Containers/com.docker.docker/Data/vms"
        - "{{ homedir }}/Library/Group Containers/UBF8T346G9.OneDriveStandaloneSuite"
        - "{{ homedir }}/Library/IdentityServices"    # frequently changing
        - "{{ homedir }}/Movies"
        - "{{ homedir }}/Music"
        - "{{ homedir }}/go"
